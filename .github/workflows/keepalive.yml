name: Keep-Alive Supabase DB

on:
  schedule:
    # Runs every 3 days at 00:00 UTC to prevent Supabase auto-pausing
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Ping Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma db execute --stdin <<< "SELECT 1;"
